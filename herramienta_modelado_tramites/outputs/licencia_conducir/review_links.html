      background: #fff;
      color: var(--text);
      font: inherit;
      font-size: 13px;

    input {

    button {

    main {

      padding: 18px;

      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 16px;

    .stat {
      padding: 12px;

      border-radius: 6px;
      background: var(--panel);

    .stat strong {

      font-size: 22px;

      color: var(--muted);
      font-size: 12px;

    .notice {
      margin-bottom: 16px;
      padding: 12px;
      border: 1px solid #fedf89;
      border-radius: 6px;
      background: #fffaeb;
      color: #7a4d00;
      font-size: 13px;
      line-height: 1.45;
    }

    .links {
      display: grid;
      gap: 10px;
    }

    .link-card {
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--panel);
      padding: 14px;
    }

    .link-card.hidden { display: none; }

    .link-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .link-title {
      margin: 0 0 6px;
      font-size: 16px;
      line-height: 1.25;
    }

    .link-title a {
      color: var(--blue);
      text-decoration: none;
    }

    .link-title a:hover { text-decoration: underline; }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #f6f8fa;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .meta {
      display: grid;
      grid-template-columns: 140px minmax(0, 1fr);
      gap: 6px 10px;
      margin: 10px 0;
      font-size: 13px;
    }

    .meta div:nth-child(odd) { color: var(--muted); }

    .url {
      overflow-wrap: anywhere;
      color: var(--muted);
    }

    .review-row {
      display: grid;
      grid-template-columns: minmax(180px, 240px) minmax(160px, 1fr);
      gap: 10px;
      margin-top: 12px;
      align-items: start;

      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px;
      font: inherit;
      font-size: 13px;

      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
      font-size: 13px;

      padding: 3px 8px;

      border-radius: 999px;
      background: #f6f8fa;
    }

    .secondary-roles input {
      width: 14px;
      height: 14px;
    }

        const matchesRole = !role || card.dataset.role === role;
        const matchesStatus = !status || card.dataset.status === status;
        card.classList.toggle("hidden", !(matchesQuery && matchesRole && matchesStatus));
      });
    }

    function searchText(link) {
      return [link.link_id, link.title, link.url, link.anchor_text, link.source_context]
        .join(" ")
        .toLowerCase();
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeAttr(value) {
      return escapeHtml(value).replaceAll("`", "&#096;");
    }

    function roleLabel(code) {
      const role = DATA.roles.find(item => item.code === code);
      return role ? role.label : code;
    }
  </script>
</body>
</html>
